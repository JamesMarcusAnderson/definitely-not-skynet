name: Validate Phase 1.1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build BOOTX64.EFI
        run: make
      - name: Check EFI output exists
        run: test -f BOOTX64.EFI && file BOOTX64.EFI
